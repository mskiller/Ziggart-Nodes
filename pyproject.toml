[project]
name = "ziggart-nodes"
description = "High-speed 700MB+ YAML/TXT Wildcard & Canonical Theme suite, Krea2 (Qwen3VL-4B) Trio/Duo Prompt Director with Spatial Layout Designer & Regional Conditioning Composer, Local GGUF & OpenAI-Compatible API VLM Loader (with JSON schema outputs, KV-cache quantization & text-only GGUF mode), Streaming Interactive Vision Prompt Chat Gate (Stop/Reset/Diff/Region-Pinning), Batch Folder Vision Captioner with resume manifest, Folder Image Queue Loader, Vision Single-Line TXT Saver & Dataset Caption Curator, Closed-Loop Self-Healing Detailer, Contour Mask Refiner, WeVisOne-VL detection, RTX 3070 Ti 3D Gaussian/Mesh generation, Direct3D-V3 latent-free voxel mesh refinement (INT8 Triton, Multiview, Sparse Dual Contouring), 3D VRM Avatar/HairDeck/Mocap Studio, and FlowHMR 3D Video & Webcam Mocap Pipeline."
version = "1.11.0"
authors = [
    { name = "mskiller", email = "mskiller51@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "llama-cpp-python>=0.3.35",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "huggingface_hub>=0.20.0",
]
readme = "README.md"

[project.optional-dependencies]
3d = ["trimesh>=4.0.0", "pygltflib>=1.16.0", "omegaconf>=2.3.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Repository = "https://github.com/mskiller/Ziggart-Nodes"

[tool.comfy]
PublisherId = "mskiller"
DisplayName = "Ziggart Nodes"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
