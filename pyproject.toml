[project]
name = "ziggart-nodes"
description = "High-speed 700MB+ YAML/TXT Wildcard & Canonical Theme suite, Krea2 (Qwen3VL-4B) Trio/Duo Prompt Director with Spatial Layout Designer & Regional Conditioning Composer, Folder Image Queue Loader, Vision Single-Line TXT Saver & Dataset Caption Curator / Trigger Injector, Prefix KV-Cached GGUF VLM Batch Pipeline, Closed-Loop Self-Healing Detailer, Contour Mask Refiner, Color/Frequency Matcher, WeVisOne-VL detection, RTX 3070 Ti 3D Gaussian/Mesh generation, 3D VRM Avatar, HairDeck & Live Webcam Mocap Studio, and FlowHMR 3D Video & Webcam Mocap Pipeline."
version = "1.9.0"
authors = [
    { name = "mskiller", email = "mskiller51@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "llama-cpp-python>=0.3.35",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "huggingface_hub>=0.20.0",
]
readme = "README.md"

[project.optional-dependencies]
3d = ["trimesh>=4.0.0", "scipy>=1.10.0"]
vision = ["ultralytics>=8.0.0", "sahi>=0.11.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Repository = "https://github.com/mskiller/Ziggart-Nodes"

[tool.comfy]
PublisherId = "mskiller"
DisplayName = "Ziggart Nodes"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
